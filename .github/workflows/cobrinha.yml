name: cobrinha

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cobrinha.yml"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Mesma paleta do neofetch: quadrados azuis, cobra laranja
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffa657&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#79c0ff
            dist/snake-light.svg?palette=github-light&color_snake=#bc4c00&color_dots=#eff2f5,#cae8ff,#80ccff,#218bff,#0550ae

      # Publica os SVGs na branch "output" (o README aponta pra lá)
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
